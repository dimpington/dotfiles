add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character
"""

[directory]
style = "blue bold"
truncate_to_repo = false

[git_branch]
symbol = "🌱 "
style = "green bold"

[git_status]
style = "red bold"

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[➜](bold red) "
